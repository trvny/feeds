name: Finalize Feedseek migration

on:
  push:
    branches: [chore/feedseek-root]
    paths:
      - ".github/workflows/feedseek-finalize.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feedseek-finalize
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Clean generated output and future-proof repository URLs
        run: |
          rm -rf public
          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          ignored_roots = {"cache", "feeds", "kanarek", ".git", ".venv", "node_modules", "public"}
          backup_names = {"repository-split-overview.md", "repository-split-overview_pl.md"}
          replacements = (
              ("https://raw.githubusercontent.com/trvny/feedseek/main/", "https://raw.githubusercontent.com/trvny/feedseek/main/"),
              ("https://github.com/trvny/feedseek", "https://github.com/trvny/feedseekeek"),
              ("https://trvny.github.io/feedseek/", "https://trvny.github.io/feedseek/"),
          )

          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              rel = path.relative_to(root)
              if rel.parts and rel.parts[0] in ignored_roots:
                  continue
              if path.name in backup_names:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              new = text
              for old, replacement in replacements:
                  new = new.replace(old, replacement)
              if new != text:
                  path.write_text(new, encoding="utf-8")

          ignore = root / ".gitignore"
          text = ignore.read_text(encoding="utf-8")
          if "\n/public/\n" not in f"\n{text}":
              text = text.rstrip() + "\n\n# Generated Feedseek site\n/public/\n"
              ignore.write_text(text, encoding="utf-8")
          PY

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          cache-python: true
          python-version: "3.14"

      - name: Validate final tree
        env:
          GITHUB_REPOSITORY: trvny/feedseek
          SITE_URL: https://trvny.github.io/feedseek/
        run: |
          uv sync --locked
          uv run --locked python -m unittest discover -s tests
          uv run --locked feed_generators/validate_feeds.py
          python3 site/build_site.py
          rm -rf public

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize Feedseek root layout"
          git push
