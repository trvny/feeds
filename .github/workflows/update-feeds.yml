name: Update Feeds

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-feeds.yml"
  schedule:
    - cron: "37 */2 * * *" # co 2 godziny
  workflow_dispatch:
    inputs:
      allow_empty_cache:
        description: >-
          Generate even if the R2 cache cannot be restored. Accumulator feeds
          (daily_quote, openweather, ...) will be republished from scratch and
          their history lost. Only for bootstrapping an empty bucket.
        type: boolean
        default: false

concurrency:
  group: update-feeds
  cancel-in-progress: true

permissions:
  contents: write

env:
  FEEDSEEK_CACHE_BUCKET: feedseek-cache
  FEEDSEEK_CACHE_KEY: snapshots/cache.tar.gz
  FEEDSEEK_CACHE_MAX_BYTES: 134217728

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 69
    steps:
      - name: Checkout repository
        # zizmor: ignore[artipacked] this job commits & pushes feeds back, so it needs persisted creds
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolve latest stable Wrangler 4
        id: wrangler
        run: |
          version="$(npm view 'wrangler@>=4 <5' version --json | python3 -c \
            'import json, sys; value=json.load(sys.stdin); print(value[-1] if isinstance(value, list) else value)')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "WRANGLER_VERSION=$version" >> "$GITHUB_ENV"

      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-wrangler-${{ steps.wrangler.outputs.version }}

      - name: Prepare R2 cache bucket
        id: r2
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare credentials unavailable; using the repository cache seed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          response="$RUNNER_TEMP/r2-buckets.json"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets?per_page=1000" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --output "$response"

          exists="$(python3 - "$response" "$FEEDSEEK_CACHE_BUCKET" <<'PY'
          import json
          import sys

          path, bucket = sys.argv[1:]
          data = json.load(open(path, encoding="utf-8"))
          if not data.get("success"):
              raise SystemExit("Cloudflare bucket listing failed")
          print("true" if any(item.get("name") == bucket for item in data.get("result", {}).get("buckets", [])) else "false")
          PY
          )"

          if [ "$exists" != "true" ]; then
            create_response="$RUNNER_TEMP/r2-create.json"
            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors \
              --request POST \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data "{\"name\":\"$FEEDSEEK_CACHE_BUCKET\"}" \
              --output "$create_response"
            python3 - "$create_response" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if not data.get("success"):
              raise SystemExit("Cloudflare bucket creation failed")
          PY
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      # Failing here is deliberate and load-bearing. There is no repository seed
      # any more, and eight generators (daily_quote, daily_digest, openweather,
      # visualcrossing, open_meteo, nexusmods_news ...) *accumulate* history
      # rather than refetching it: daily_quote merges today's quote into the
      # cached entries, so an empty cache republishes its 43-entry feed with a
      # single entry. Those are daily snapshots of sources that no longer serve
      # the old values, so the truncation would be permanent and would be
      # committed. Stale feeds during an R2 outage are strictly better than
      # truncated ones, so the run stops instead of warning.
      - name: Restore Feedseek cache from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALLOW_EMPTY_CACHE: ${{ inputs.allow_empty_cache && 'true' || 'false' }}
          R2_READY: ${{ steps.r2.outputs.ready }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/feedseek-cache.tar.gz"
          restore_dir="$(mktemp -d)"
          trap 'rm -rf "$restore_dir"' EXIT

          if [ "$R2_READY" = "true" ] && \
            npx --yes "wrangler@$WRANGLER_VERSION" r2 object get \
            "$FEEDSEEK_CACHE_BUCKET/$FEEDSEEK_CACHE_KEY" \
            --file "$archive" \
            --remote && \
            python3 feedseek/tools/restore_cache_archive.py \
              "$archive" "$restore_dir"; then
            rm -rf feedseek/cache
            mv "$restore_dir/cache" feedseek/cache
            echo "Restored Feedseek cache from R2."
          elif [ "$ALLOW_EMPTY_CACHE" = "true" ]; then
            echo "::warning::No usable R2 snapshot; continuing with an empty cache because allow_empty_cache was requested. Accumulated feed history will be rebuilt from scratch."
          else
            echo "::error::Could not restore the Feedseek cache from R2, and there is no repository seed to fall back on."
            echo "::error::Refusing to generate: accumulator feeds would be republished truncated. Re-run with allow_empty_cache=true only if that is intended."
            exit 1
          fi

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-python: true
          python-version: "3.14"
          working-directory: feedseek

      - name: Install dependencies
        working-directory: feedseek
        run: uv sync --locked

      - name: Run feed tests
        working-directory: feedseek
        run: uv run --locked python -m unittest discover -s tests

      - name: Generate feeds
        id: generate
        continue-on-error: true
        working-directory: feedseek
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          VISUALCROSSING_API_KEY: ${{ secrets.VISUALCROSSING_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          THEYSAIDSO_API_KEY: ${{ secrets.THEYSAIDSO_API_KEY }}
        run: uv run --locked feed_generators/run_all_feeds.py

      - name: Validate feeds
        id: validate
        continue-on-error: true
        working-directory: feedseek
        run: uv run --locked feed_generators/validate_feeds.py

      - name: Regenerate docs/sources.md
        continue-on-error: true
        working-directory: feedseek
        run: uv run --locked feed_generators/docs_sources.py

      - name: Back up Feedseek cache to R2
        if: >-
          always() &&
          github.ref == 'refs/heads/main' &&
          steps.r2.outputs.ready == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/feedseek-cache.tar.gz"
          cache_bytes="$(find feedseek/cache -type f -printf '%s\n' | awk '{total += $1} END {print total + 0}')"
          if [ "$cache_bytes" -gt "$FEEDSEEK_CACHE_MAX_BYTES" ]; then
            echo "::warning::Feedseek cache is $cache_bytes bytes; keeping the existing R2 snapshot (limit: $FEEDSEEK_CACHE_MAX_BYTES)."
            exit 0
          fi

          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "$archive" \
            -C feedseek cache
          npx --yes "wrangler@$WRANGLER_VERSION" r2 object put \
            "$FEEDSEEK_CACHE_BUCKET/$FEEDSEEK_CACHE_KEY" \
            --file "$archive" \
            --content-type application/gzip \
            --remote

      - name: Commit and push successful updates
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # feedseek/cache is deliberately absent: R2 holds it now (docs/cache.md).
          # It is also gitignored, so the restore step's rm -rf/mv leaves no
          # unstaged changes for the `git pull --rebase` fallback below to trip on.
          git add feedseek/feeds feedseek/docs/sources.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m 'Update feeds'
            git push || { git pull --rebase && git push; }
          fi

      - name: Apply feed health gate
        if: always()
        env:
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          if [ "$GENERATE_OUTCOME" != "success" ] || [ "$VALIDATE_OUTCOME" != "success" ]; then
            echo "Feed generation or validation reported failures; successful partial updates were still published."
            exit 1
          fi
