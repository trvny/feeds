name: Probe development feed sources

on:
  push:
    branches: [dev-feed-staging]
    paths:
      - feed_generators/development.py
      - tests/test_development_sources.py
      - tools/_probe_dev_sources.py
      - .github/workflows/_probe-dev-feed.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run --locked ruff check feed_generators/development.py tests/test_development_sources.py tools/_probe_dev_sources.py
      - run: uv run --locked python -m unittest tests/test_development_sources.py
      - run: uv run --locked python tools/_probe_dev_sources.py
