name: Feedseek root migration

on:
  push:
    branches: [chore/feedseek-root]

permissions:
  contents: write

concurrency:
  group: feedseek-root-migration
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Move Feedseek to repository root
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          def git(*args):
              subprocess.run(["git", *args], check=True)

          root = Path.cwd()
          nested = root / "feedseek"
          if not nested.is_dir():
              raise SystemExit("feedseek/ is missing")

          old_readme = (root / "README.md").read_text(encoding="utf-8")
          old_readme_pl = (root / "README_pl.md").read_text(encoding="utf-8")
          (root / "docs").mkdir(exist_ok=True)
          (root / "docs" / "repository-split-overview.md").write_text(old_readme, encoding="utf-8")
          (root / "docs" / "repository-split-overview_pl.md").write_text(old_readme_pl, encoding="utf-8")

          git("rm", "README.md")
          git("mv", "feedseek/README.md", "README.md")
          for name in ("cache.md", "feeds.md", "sources.md"):
              git("mv", f"feedseek/docs/{name}", f"docs/{name}")
          Path("feedseek/docs").rmdir()

          for name in (
              "Makefile", "cache", "feed_generators", "feeds", "feeds.yaml",
              "pyproject.toml", "site", "tests", "tools", "uv.lock",
          ):
              git("mv", f"feedseek/{name}", name)
          nested.rmdir()

          replacements = (
              ("feedseek/feeds/", "feeds/"),
              ("feedseek/feeds", "feeds"),
              ("feedseek/cache/", "cache/"),
              ("feedseek/cache", "cache"),
              ("feedseek/docs/", "docs/"),
              ("feedseek/docs", "docs"),
              ("feedseek/site/", "site/"),
              ("feedseek/site", "site"),
              ("feedseek/tools/", "tools/"),
              ("feedseek/tools", "tools"),
              ("feedseek/feed_generators/", "feed_generators/"),
              ("feedseek/feed_generators", "feed_generators"),
              ("feedseek/tests/", "tests/"),
              ("feedseek/tests", "tests"),
              ("feedseek/public/", "public/"),
              ("feedseek/public", "public"),
              ("feedseek/pyproject.toml", "pyproject.toml"),
              ("feedseek/uv.lock", "uv.lock"),
              ("feedseek/Makefile", "Makefile"),
              ("working-directory: feedseek", "working-directory: ."),
              ("cd feedseek\n", ""),
              ("-C feedseek cache", "-C . cache"),
          )

          backups = {
              Path("docs/repository-split-overview.md"),
              Path("docs/repository-split-overview_pl.md"),
          }
          temporary = Path(".github/workflows/feedseek-root-migration.yml")
          for raw in subprocess.check_output(["git", "ls-files"], text=True).splitlines():
              path = Path(raw)
              if path in backups or path == temporary or not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              new = text
              for old, replacement in replacements:
                  new = new.replace(old, replacement)
              if path == Path("README.md"):
                  new = new.replace("../assets/", "assets/")
              if path == Path("site/build_site.py"):
                  new = new.replace('ASSETS_DIR = ROOT.parent / "assets"', 'ASSETS_DIR = ROOT / "assets"')
              if new != text:
                  path.write_text(new, encoding="utf-8")

          # Root-aware registry tests. The detailed Feedseek README is now the
          # English root README; only the compact Polish overview carries a
          # duplicated numeric badge/count, so validate that one here.
          path = Path("tests/test_registry_docs.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'ROOT = Path(__file__).resolve().parents[2]\nFEEDSEEK = ROOT / "feedseek"',
              'ROOT = Path(__file__).resolve().parents[1]\nFEEDSEEK = ROOT',
          )
          old = '''        english = (ROOT / "README.md").read_text(encoding="utf-8")
          polish = (ROOT / "README_pl.md").read_text(encoding="utf-8")

          counts = [
              int(re.search(r"feeds-(\\d+)-d6541a", english).group(1)),
              int(re.search(r"feeds\\.yaml \\((\\d+) sources\\)", english).group(1)),
              int(re.search(r"feeds-(\\d+)-d6541a", polish).group(1)),
              int(re.search(r"feeds\\.yaml \\((\\d+) źródeł\\)", polish).group(1)),
          ]
          self.assertEqual(counts, [expected] * len(counts))'''
          new = '''        polish = (ROOT / "README_pl.md").read_text(encoding="utf-8")

          counts = [
              int(re.search(r"feeds-(\\d+)-d6541a", polish).group(1)),
              int(re.search(r"feeds\\.yaml \\((\\d+) źródeł\\)", polish).group(1)),
          ]
          self.assertEqual(counts, [expected] * len(counts))'''
          text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")

          # Publish metadata from the repository GitHub says is running the job.
          # This survives the feeds -> feedseek rename without another path edit.
          path = Path("feed_generators/jsonfeed.py")
          text = path.read_text(encoding="utf-8")
          if "import os\n" not in text:
              text = text.replace("import json\n", "import json\nimport os\n")
          text = re.sub(
              r'^_FEED_URL_TMPL = .*$',
              'REPO_SLUG = os.getenv("RSS_REPO_SLUG") or os.getenv("GITHUB_REPOSITORY") or "trvny/feedseek"\n_FEED_URL_TMPL = f"https://raw.githubusercontent.com/{REPO_SLUG}/main/feeds/feed_{{name}}.json"',
              text,
              flags=re.MULTILINE,
          )
          path.write_text(text, encoding="utf-8")

          path = Path("feed_generators/normalize_feed_self_links.py")
          text = path.read_text(encoding="utf-8")
          if "import os\n" not in text:
              text = text.replace("import logging\n", "import logging\nimport os\n")
          text = re.sub(
              r'^LEGACY_PREFIX = .*\nCURRENT_PREFIX = .*$',
              'REPO_SLUG = os.getenv("RSS_REPO_SLUG") or os.getenv("GITHUB_REPOSITORY") or "trvny/feedseek"\n'
              'CURRENT_PREFIX = f"https://raw.githubusercontent.com/{REPO_SLUG}/main/feeds/"\n'
              'LEGACY_PREFIX = "https://raw.githubusercontent.com/trvny/feeds/main/feedseek/feeds/"\n'
              'LEGACY_PREFIXES = (LEGACY_PREFIX, "https://raw.githubusercontent.com/trvny/feeds/main/feeds/")',
              text,
              flags=re.MULTILINE,
          )
          text = text.replace(
              "    normalized = content.replace(LEGACY_PREFIX, CURRENT_PREFIX)\n",
              "    normalized = content\n    for prefix in LEGACY_PREFIXES:\n        if prefix != CURRENT_PREFIX:\n            normalized = normalized.replace(prefix, CURRENT_PREFIX)\n",
          )
          path.write_text(text, encoding="utf-8")

          path = Path("feed_generators/utils.py")
          text = path.read_text(encoding="utf-8").replace(
              'or "trvny/feeds"', 'or "trvny/feedseek"'
          )
          path.write_text(text, encoding="utf-8")

          path = Path("site/build_site.py")
          text = path.read_text(encoding="utf-8").replace(
              'return "https://trvny.github.io/feeds/"',
              'return "https://trvny.github.io/feedseek/"',
          )
          path.write_text(text, encoding="utf-8")

          path = Path("site/published_feeds.txt")
          text = path.read_text(encoding="utf-8").replace(
              "https://trvny.github.io/feeds/", "https://trvny.github.io/feedseek/"
          )
          path.write_text(text, encoding="utf-8")

          path = Path("tests/test_feed_metadata_paths.py")
          text = path.read_text(encoding="utf-8").replace(
              "Generators must publish self links from /feedseek/feeds/: ",
              "Generators must publish self links from /feeds/: ",
          )
          path.write_text(text, encoding="utf-8")

          # Keep the Polish overview but describe the post-move root layout.
          path = Path("README_pl.md")
          pl = path.read_text(encoding="utf-8")
          pl = pl.replace("(feedseek/feeds.yaml)", "(feeds.yaml)")
          pl = pl.replace("`feedseek/` docelowo staje się rootem repo wraz z wygaszaniem starego układu monorepo.\n", "")
          pl = pl.replace("cd feedseek\n", "")
          pl = pl.replace("`feedseek/README.md` i `feedseek/docs/`", "`README.md` i `docs/`")
          old_tree = """```text
          feeds/
          ├── feedseek/          # kod Feedseek, rejestr, testy i wygenerowane wyniki
          ├── feeds-proxy/       # pomocniczy Worker Cloudflare
          ├── kanarek/           # tymczasowa kopia na czas rozdzielania repo
          └── .github/workflows/ # generowanie, publikacja i testy
          ```""".replace("          ", "")
          new_tree = """```text
          feedseek/
          ├── feed_generators/   # generatory i wspólne narzędzia
          ├── feeds/             # wygenerowane XML/JSON
          ├── site/              # GitHub Pages + czytnik
          ├── tests/             # testy
          ├── feeds-proxy/       # pomocniczy Worker Cloudflare
          ├── kanarek/           # zamrożona kopia do czasu przepięcia podpisywania
          └── .github/workflows/ # generowanie, publikacja i testy
          ```""".replace("          ", "")
          pl = pl.replace(old_tree, new_tree)
          path.write_text(pl, encoding="utf-8")

          git("rm", ".github/workflows/feedseek-root-migration.yml")
          PY

      - name: Fix root-aware workflow detection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/mega-linter.yml')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'if ! git diff --quiet "$BASE_SHA" HEAD -- feedseek/; then\n              tests=true\n              artifacts=true\n            fi',
              'if ! git diff --quiet "$BASE_SHA" HEAD -- Makefile pyproject.toml uv.lock feeds.yaml feed_generators/ tests/ site/ docs/ README.md README_pl.md; then\n              tests=true\n              artifacts=true\n            fi'
          )
          p.write_text(text, encoding='utf-8')
          PY

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          cache-python: true
          python-version: "3.14"

      - name: Validate migrated layout
        run: |
          uv sync --locked
          uv run --locked python -m unittest discover -s tests
          uv run --locked feed_generators/validate_feeds.py
          SITE_URL="https://trvny.github.io/feeds/" python3 site/build_site.py
          python3 site/make_opml.py

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: move Feedseek to repository root"
          git push
