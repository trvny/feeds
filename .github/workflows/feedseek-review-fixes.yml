name: Apply Feedseek migration review fixes

on:
  push:
    branches: [chore/feedseek-root]
    paths:
      - ".github/workflows/feedseek-review-fixes.yml"
      - "tools/apply_migration_review_fixes.py"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Apply review fixes
        run: python3 tools/apply_migration_review_fixes.py

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-python: true
          python-version: "3.14"

      - name: Validate migration
        env:
          GITHUB_REPOSITORY: trvny/feeds
          SITE_URL: https://trvny.github.io/feeds/
        run: |
          uv sync --locked
          uv run --locked python -m unittest discover -s tests
          uv run --locked feed_generators/validate_feeds.py
          python3 site/build_site.py
          python3 site/make_favicon.py
          python3 site/make_opml.py
          test -f public/favicon.ico
          test -f feedseek/feeds/feed_reuters.xml
          test -f feedseek/feeds/feed_reuters.json

      - name: Commit
        run: |
          rm -rf public
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finish Feedseek migration compatibility"
          git push
