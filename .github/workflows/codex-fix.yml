# Manually requested Codex fixes for repository checks.
---
name: Codex fix

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      target:
        description: Check to reproduce
        required: true
        type: choice
        options:
          - android
          - worker
          - lint
      context:
        description: Optional failure details or run URL
        required: false
        type: string

concurrency:
  group: codex-fix-${{ github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  fix_and_pr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        if: inputs.target == 'worker'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: kanarek/worker/package-lock.json

      - name: Install Kanarek Worker dependencies
        if: inputs.target == 'worker'
        run: npm ci
        working-directory: kanarek/worker

      - name: Install feeds-proxy dependencies
        if: inputs.target == 'worker'
        run: npm install
        working-directory: feeds-proxy

      - name: Install uv and Python
        if: inputs.target == 'lint'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-python: true

      - name: Install Feedseek dependencies
        if: inputs.target == 'lint'
        run: uv sync
        working-directory: feedseek

      - name: Set up JDK 17
        if: inputs.target == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: inputs.target == 'android'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Run Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            Fix the selected repository check on the current default branch.
            Target: ${{ inputs.target }}
            Additional context: ${{ inputs.context || 'none' }}

            Reproduce only the selected check:
            - android: from `kanarek`, run
              `./gradlew assemblePlayDebug assembleFossDebug testPlayDebugUnitTest lintPlayDebug --stacktrace`.
            - worker: from `kanarek/worker`, run `npm run typecheck` and `npm test`;
              from `feeds-proxy`, run `npm run typecheck`.
            - lint: inspect the supplied failure context. For Feedseek failures,
              from `feedseek` run `uv run python -m unittest discover -s tests` and
              `uv run feed_generators/validate_feeds.py`.

            Identify and implement the smallest relevant fix, then rerun the smallest
            useful verification. Do not modify generated feed or cache output unless
            the selected failure specifically requires it.

      - name: Check for changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes and open PR
        if: steps.diff.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.run_id }}
          TARGET: ${{ inputs.target }}
        run: |
          branch="codex/fix-$TARGET-$RUN_ID"
          git switch -c "$branch"
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix $TARGET checks via Codex"
          gh auth setup-git
          git push origin "$branch"
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$branch" \
            --title "Fix $TARGET checks via Codex" \
            --body "Codex generated this patch from a manually requested run. Review before merging."
