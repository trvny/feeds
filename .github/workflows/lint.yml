---
name: Lint

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths-ignore:
      - "feedseek/feeds/**"
      - "feedseek/cache/**"
  pull_request: null

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: MegaLinter, tests & secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Feedseek changes
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          tests=false
          artifacts=false
          if [ "$EVENT_NAME" = "push" ]; then
            tests=true
            artifacts=true
          else
            if ! git diff --quiet "$BASE_SHA" HEAD -- feedseek/; then
              tests=true
              artifacts=true
            fi
            if ! git diff --quiet "$BASE_SHA" HEAD -- .github/workflows/lint.yml; then
              tests=true
            fi
          fi
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "artifacts=$artifacts" >> "$GITHUB_OUTPUT"

      - name: Install uv and Python
        if: steps.paths.outputs.tests == 'true'
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-python: true

      - name: Install Feedseek dependencies
        if: steps.paths.outputs.tests == 'true'
        working-directory: feedseek
        run: uv sync

      - name: Test Feedseek
        if: steps.paths.outputs.tests == 'true'
        id: feedseek_tests
        continue-on-error: true
        working-directory: feedseek
        run: uv run python -m unittest discover -s tests

      - name: Validate feed artifacts
        if: steps.paths.outputs.artifacts == 'true'
        id: feed_artifacts
        continue-on-error: true
        working-directory: feedseek
        run: uv run feed_generators/validate_feeds.py

      - name: MegaLinter
        id: megalinter
        continue-on-error: true
        uses: oxsecurity/megalinter/flavors/python@v9
        env:
          MEGALINTER_CONFIG: .github/linters/.mega-linter.yml
          VALIDATE_ALL_CODEBASE: >-
            ${{
              github.event_name == 'push' &&
              contains(fromJSON('["refs/heads/main", "refs/heads/master"]'), github.ref)
            }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY_FIXES_EVENT: none

      - name: Archive MegaLinter reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MegaLinter reports
          include-hidden-files: "true"
          retention-days: 7
          path: |
            megalinter-reports
            mega-linter.log

      - name: Gate Feedseek tests
        if: >-
          always() &&
          steps.paths.outputs.tests == 'true' &&
          steps.feedseek_tests.outcome != 'success'
        run: exit 1

      - name: Gate feed artifacts
        if: >-
          always() &&
          steps.paths.outputs.artifacts == 'true' &&
          steps.feed_artifacts.outcome != 'success'
        run: exit 1

      - name: Gate MegaLinter
        if: always()
        env:
          MEGALINTER_OUTCOME: ${{ steps.megalinter.outcome }}
        run: |
          if [ "$MEGALINTER_OUTCOME" != "success" ]; then
            echo "MegaLinter reported blocking errors"
            exit 1
          fi
