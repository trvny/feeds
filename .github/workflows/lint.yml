---
name: Lint

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths-ignore:
      - "feedseek/feeds/**"
      - "feedseek/cache/**"
  pull_request: null

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair_pr136:
    if: github.event_name == 'pull_request' && github.head_ref == 'feeds/github-europa-audio'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-python: true

      - name: Repair Feedseek changes
        run: |
          git fetch origin main
          git checkout origin/main -- feeds-proxy/README.md feeds-proxy/src/index.js
          python .github/scripts/pr136_repair.py

      - name: Install Feedseek dependencies
        working-directory: feedseek
        run: uv sync

      - name: Format changed Python
        working-directory: feedseek
        run: |
          files=(
            feed_generators/audio.py
            feed_generators/docs_sources.py
            feed_generators/github.py
            feed_generators/microsoft.py
            feed_generators/mozilla.py
            feed_generators/multi_rss.py
            feed_generators/tvp.py
            feed_generators/usgov.py
          )
          uv run ruff check --fix-only "${files[@]}"
          uvx isort "${files[@]}"
          uvx black --line-length 120 "${files[@]}"
          uv run ruff check --fix-only "${files[@]}"

      - name: Generate documentation and artifacts
        working-directory: feedseek
        run: |
          uv run python feed_generators/docs_sources.py
          uv run python feed_generators/audio.py
          uv run python feed_generators/github.py
          uv run python feed_generators/europa.py

      - name: Test Feedseek repair
        working-directory: feedseek
        run: uv run python -m unittest discover -s tests

      - name: Validate generated artifacts
        working-directory: feedseek
        run: uv run feed_generators/validate_feeds.py

      - name: Check repair diff
        run: git diff --check

      - name: Verify and publish repair
        run: |
          if ! git diff --quiet origin/main -- feeds-proxy/; then
            echo "feeds-proxy still differs from main"
            exit 1
          fi
          test -f feedseek/feeds/feed_audio.json
          test -f feedseek/feeds/feed_europa.json
          test -f feedseek/feeds/feed_github.json
          test -f feedseek/cache/audio_posts.json
          test -f feedseek/cache/europa_posts.json
          test -f feedseek/cache/github_posts.json

          git checkout origin/main -- .github/workflows/lint.yml
          rm -f .github/scripts/pr136_repair.py .github/workflows/pr136-repair.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(feedseek): address PR review"
          git push origin HEAD:${{ github.head_ref }}

  build:
    name: MegaLinter, tests & secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Feedseek changes
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          tests=false
          artifacts=false
          if [ "$EVENT_NAME" = "push" ]; then
            tests=true
            artifacts=true
          else
            if ! git diff --quiet "$BASE_SHA" HEAD -- feedseek/; then
              tests=true
              artifacts=true
            fi
            if ! git diff --quiet "$BASE_SHA" HEAD -- .github/workflows/lint.yml; then
              tests=true
            fi
          fi
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "artifacts=$artifacts" >> "$GITHUB_OUTPUT"

      - name: Install uv and Python
        if: steps.paths.outputs.tests == 'true'
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-python: true

      - name: Install Feedseek dependencies
        if: steps.paths.outputs.tests == 'true'
        working-directory: feedseek
        run: uv sync

      - name: Test Feedseek
        if: steps.paths.outputs.tests == 'true'
        id: feedseek_tests
        continue-on-error: true
        working-directory: feedseek
        run: uv run python -m unittest discover -s tests

      - name: Validate feed artifacts
        if: steps.paths.outputs.artifacts == 'true'
        id: feed_artifacts
        continue-on-error: true
        working-directory: feedseek
        run: uv run feed_generators/validate_feeds.py

      - name: MegaLinter
        id: megalinter
        continue-on-error: true
        uses: oxsecurity/megalinter/flavors/python@v9
        env:
          MEGALINTER_CONFIG: .github/linters/.mega-linter.yml
          VALIDATE_ALL_CODEBASE: >-
            ${{
              github.event_name == 'push' &&
              contains(fromJSON('["refs/heads/main", "refs/heads/master"]'), github.ref)
            }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY_FIXES_EVENT: none
          APPLY_FIXES_MODE: commit

      - name: Archive MegaLinter reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MegaLinter reports
          include-hidden-files: "true"
          path: |
            megalinter-reports
            mega-linter.log

      - name: Secret scanning
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

      - name: Gate Feedseek tests
        if: >-
          always() &&
          steps.paths.outputs.tests == 'true' &&
          steps.feedseek_tests.outcome != 'success'
        run: exit 1

      - name: Gate feed artifacts
        if: >-
          always() &&
          steps.paths.outputs.artifacts == 'true' &&
          steps.feed_artifacts.outcome != 'success'
        run: exit 1

      - name: Gate MegaLinter
        if: always()
        env:
          MEGALINTER_OUTCOME: ${{ steps.megalinter.outcome }}
          MEGALINTER_UPDATED: ${{ steps.megalinter.outputs.has_updated_sources }}
        run: |
          if [ "$MEGALINTER_UPDATED" = "1" ]; then
            echo "MegaLinter changed source files"
            exit 1
          fi
          if find megalinter-reports/linters_logs -type f -name '*-ERROR.log' -print -quit 2>/dev/null | grep -q .; then
            echo "MegaLinter reported blocking errors"
            exit 1
          fi
          if [ "$MEGALINTER_OUTCOME" != "success" ] && [ ! -f megalinter-reports/megalinter-report.md ]; then
            echo "MegaLinter failed before producing a report"
            exit 1
          fi
