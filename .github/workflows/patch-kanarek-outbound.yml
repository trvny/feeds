name: Patch Kanarek outbound hardening

on:
  push:
    branches: [agent/harden-kanarek-outbound]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-slim
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/harden-kanarek-outbound

      - name: Apply focused patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("kanarek/worker/src/index.ts")
          source = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, got {count}: {old[:80]!r}")
              source = source.replace(old, new, 1)

          replace_once(
              "const MAX_DISCOVERED = 10;\nconst MAX_READ_IDS = 2000;",
              "const MAX_DISCOVERED = 10;\nconst MAX_OUTBOUND_REDIRECTS = 3;\nconst MAX_READ_IDS = 2000;",
          )
          replace_once(
              "valid.map((f) => fetchFeed(f))",
              "valid.map((f) => fetchFeed(f, env))",
          )

          count = source.count("const html = await fetchHtml(page);")
          if count != 2:
              raise SystemExit(f"expected two fetchHtml(page) calls, got {count}")
          source = source.replace("const html = await fetchHtml(page);", "const html = await fetchHtml(page, env);")

          replace_once(
              "const head = await fetchText(candidate, 1500);",
              "const head = await fetchText(candidate, 1500, env);",
          )

          old_helpers = '''async function fetchHtml(pageUrl: string): Promise<string> {
            return fetchText(pageUrl, PAGE_TIMEOUT_MS);
          }

          async function fetchText(target: string, timeoutMs: number): Promise<string> {
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), timeoutMs);
            try {
              const res = await fetch(target, {
                signal: ctrl.signal,
                headers: { "user-agent": "kanarek/1.0 (+https://github.com/trvny/feeds)", accept: "text/html, application/xhtml+xml, application/xml, text/xml" },
                cf: { cacheTtl: CACHE_TTL_S, cacheEverything: true },
              });
              if (!res.ok) throw new Error(`${target}: HTTP ${res.status}`);
              return await readCapped(res, MAX_HTML_BYTES);
            } finally {
              clearTimeout(t);
            }
          }'''

          new_helpers = '''export async function fetchOutbound(target: string | URL, env: Env, init: RequestInit = {}): Promise<Response> {
            let current = new URL(target);

            for (let redirects = 0; redirects <= MAX_OUTBOUND_REDIRECTS; redirects++) {
              const defaultPort = current.protocol === "https:" ? "443" : current.protocol === "http:" ? "80" : "";
              if (!defaultPort || current.username || current.password || (current.port && current.port !== defaultPort)) {
                throw new Error("host not allowed");
              }
              if (!hostAllowed(current.hostname, env)) throw new Error("host not allowed");

              const response = await fetch(current, { ...init, redirect: "manual" });
              if (![301, 302, 303, 307, 308].includes(response.status)) return response;
              if (redirects === MAX_OUTBOUND_REDIRECTS) throw new Error("too many redirects");

              const location = response.headers.get("location");
              if (!location) throw new Error("bad redirect");
              if (response.body) await response.body.cancel();
              current = new URL(location, current);
            }

            throw new Error("too many redirects");
          }

          async function fetchHtml(pageUrl: string, env: Env): Promise<string> {
            return fetchText(pageUrl, PAGE_TIMEOUT_MS, env);
          }

          async function fetchText(target: string, timeoutMs: number, env: Env): Promise<string> {
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), timeoutMs);
            try {
              const res = await fetchOutbound(target, env, {
                signal: ctrl.signal,
                headers: { "user-agent": "kanarek/1.0 (+https://github.com/trvny/feeds)", accept: "text/html, application/xhtml+xml, application/xml, text/xml" },
                cf: { cacheTtl: CACHE_TTL_S, cacheEverything: true },
              });
              if (!res.ok) throw new Error(`${target}: HTTP ${res.status}`);
              return await readCapped(res, MAX_HTML_BYTES);
            } finally {
              clearTimeout(t);
            }
          }'''
          replace_once(old_helpers, new_helpers)

          old_feed = '''async function fetchFeed(feedUrl: string): Promise<NewsItem[]> {
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), FEED_TIMEOUT_MS);
            try {
              const res = await fetch(feedUrl, {
                signal: ctrl.signal,
                headers: { "user-agent": "kanarek/1.0 (+https://github.com/trvny/feeds)", accept: "application/rss+xml, application/atom+xml, application/xml, text/xml" },
                cf: { cacheTtl: CACHE_TTL_S, cacheEverything: true },
              });
              if (!res.ok) throw new Error(`${feedUrl}: HTTP ${res.status}`);
              const xml = await readCapped(res, MAX_FEED_BYTES);
              return parseFeed(xml);
            } finally {
              clearTimeout(t);
            }
          }'''

          new_feed = '''async function fetchFeed(feedUrl: string, env: Env): Promise<NewsItem[]> {
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), FEED_TIMEOUT_MS);
            try {
              const res = await fetchOutbound(feedUrl, env, {
                signal: ctrl.signal,
                headers: { "user-agent": "kanarek/1.0 (+https://github.com/trvny/feeds)", accept: "application/rss+xml, application/atom+xml, application/xml, text/xml" },
                cf: { cacheTtl: CACHE_TTL_S, cacheEverything: true },
              });
              if (!res.ok) throw new Error(`${feedUrl}: HTTP ${res.status}`);
              const xml = await readCapped(res, MAX_FEED_BYTES);
              return parseFeed(xml);
            } finally {
              clearTimeout(t);
            }
          }'''
          replace_once(old_feed, new_feed)

          old_host = '''export function hostAllowed(host: string, env: Env): boolean {
            const allow = (env.ALLOWED_HOSTS || "").split(",").map((s) => s.trim()).filter(Boolean);
            const normalizedHost = host.toLowerCase().replace(/\\.$/, "");
            return !allow.length || allow.some((raw) => {
              const suffix = raw.toLowerCase().replace(/^\\./, "").replace(/\\.$/, "");
              return suffix.length > 0 && (normalizedHost === suffix || normalizedHost.endsWith(`.${suffix}`));
            });
          }'''

          new_host = '''export function hostAllowed(host: string, env: Env): boolean {
            const normalizedHost = host.toLowerCase().replace(/\\.$/, "");
            if (
              !normalizedHost
              || normalizedHost === "localhost"
              || normalizedHost.endsWith(".localhost")
              || normalizedHost.endsWith(".local")
              || normalizedHost.endsWith(".internal")
              || normalizedHost.endsWith(".home")
              || normalizedHost.endsWith(".lan")
              || normalizedHost.includes(":")
              || /^\\d{1,3}(?:\\.\\d{1,3}){3}$/.test(normalizedHost)
            ) return false;

            const allow = (env.ALLOWED_HOSTS || "").split(",").map((s) => s.trim()).filter(Boolean);
            return !allow.length || allow.some((raw) => {
              const suffix = raw.toLowerCase().replace(/^\\./, "").replace(/\\.$/, "");
              return suffix.length > 0 && (normalizedHost === suffix || normalizedHost.endsWith(`.${suffix}`));
            });
          }'''
          replace_once(old_host, new_host)

          path.write_text(source)

          tests = Path("kanarek/worker/test/hardening.test.ts")
          test_source = tests.read_text()
          test_source = test_source.replace(
              'import { hostAllowed, readCapped } from "../src/index";',
              'import { fetchOutbound, hostAllowed, readCapped } from "../src/index";',
          )
          addition = '''

          describe("outbound URL hardening", () => {
            it("blocks local names and literal IP addresses even without an allowlist", () => {
              const env = {};
              expect(hostAllowed("localhost", env)).toBe(false);
              expect(hostAllowed("api.localhost", env)).toBe(false);
              expect(hostAllowed("router.lan", env)).toBe(false);
              expect(hostAllowed("127.0.0.1", env)).toBe(false);
              expect(hostAllowed("[::1]", env)).toBe(false);
              expect(hostAllowed("example.com", env)).toBe(true);
            });

            it("validates the destination of every redirect", async () => {
              const originalFetch = globalThis.fetch;
              globalThis.fetch = async () => new Response(null, {
                status: 302,
                headers: { location: "http://127.0.0.1/private" },
              });
              try {
                await expect(fetchOutbound("https://example.com/feed", {}, {})).rejects.toThrow("host not allowed");
              } finally {
                globalThis.fetch = originalFetch;
              }
            });
          });
          '''
          if 'describe("outbound URL hardening"' in test_source:
              raise SystemExit("tests already patched")
          tests.write_text(test_source.rstrip() + addition)
          PY

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: kanarek/worker/package-lock.json

      - name: Validate
        working-directory: kanarek/worker
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Commit patch
        run: |
          rm .github/workflows/patch-kanarek-outbound.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kanarek/worker/src/index.ts kanarek/worker/test/hardening.test.ts .github/workflows/patch-kanarek-outbound.yml
          git commit -m "Harden Kanarek outbound fetches"
          git push origin HEAD:agent/harden-kanarek-outbound
