name: Finalize X API merge

on:
  push:
    branches: [merge-x-api-into-xai-verify]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Apply cleanup
        shell: bash
        run: |
          echo '' | base64 -d | python
      - name: Lint and regenerate
        shell: bash
        run: |
          uv run --locked ruff check --fix feed_generators/xai.py feed_generators/x_changelog.py
          uv run --locked python feed_generators/run_all_feeds.py --feed xai
          uv run --locked python feed_generators/docs_sources.py
      - name: Verify
        shell: bash
        run: |
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          cache = json.loads(Path('cache/xai_posts.json').read_text(encoding='utf-8'))
          x_api = [e for e in cache.get('entries', []) if e.get('source') == 'X API changelog']
          assert 0 < len(x_api) <= 50, len(x_api)
          assert not Path('feeds/feed_x_changelog.xml').exists()
          assert not Path('feeds/feed_x_changelog.json').exists()
          assert not Path('cache/x_changelog_posts.json').exists()
          assert 'https://docs.x.com/changelog' in Path('feeds/feed_xai.xml').read_text(encoding='utf-8')
          print(f'X API entries retained: {len(x_api)}')
          PY
          uv run --locked python -m unittest discover -s tests
          uv run --locked python feed_generators/validate_feeds.py
      - name: Commit result
        shell: bash
        run: |
          rm .github/workflows/_finalize-x-api-merge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: keep X API changelog inside xAI"
          git push
