name: Android CI

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths: ["kanarek/**", "!kanarek/worker/**"]
  pull_request:
    branches: [main]
    paths: ["kanarek/**", "!kanarek/worker/**"]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: kanarek
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          ref: ${{ github.head_ref }}

      - name: Normalize player metadata formatting
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path("kanarek/app/src/main/java/com/kanarek/player/PlayerService.kt")
          text = service.read_text()
          metadata_token = "override fun onMetadata(metadata: androidx.media3.common.Metadata)"
          error_token = "override fun onPlayerError(error: PlaybackException)"
          start = text.index(metadata_token)
          start = text.rfind("\n", 0, start) + 1
          error_start = text.index(error_token, start)
          end = text.index("{", error_start) + 1
          replacement = "\n".join(
              [
                  "                override fun onMetadata(metadata: androidx.media3.common.Metadata) {",
                  "                    if (_uiState.value.failure != null) return",
                  "                    for (i in 0 until metadata.length()) {",
                  "                        val entry = metadata.get(i)",
                  "                        if (entry is androidx.media3.extractor.metadata.icy.IcyInfo) {",
                  "                            updateNowPlaying(entry.title)",
                  "                            return",
                  "                        }",
                  "                    }",
                  "                }",
                  "",
                  "                override fun onMediaMetadataChanged(mediaMetadata: MediaMetadata) {",
                  "                    if (_uiState.value.failure != null) return",
                  "                    updateNowPlaying(",
                  "                        streamMetadataText(",
                  "                            station = _uiState.value.currentStation,",
                  "                            title = mediaMetadata.title,",
                  "                            artist = mediaMetadata.artist,",
                  "                        ),",
                  "                    )",
                  "                }",
                  "",
                  "                override fun onPlayerError(error: PlaybackException) {",
              ]
          )
          text = text[:start] + replacement + text[end:]
          service.write_text(text)

          components = Path("kanarek/app/src/main/java/com/kanarek/ui/PlayerComponents.kt")
          text = components.read_text()
          subtitle_anchor = text.index("                val subtitle = playerState.nowPlaying ?: station.groupTitle")
          start = text.index("                    Text(", subtitle_anchor)
          end = text.index("\n                }", start)
          replacement = "\n".join(
              [
                  "                    Text(",
                  "                        subtitle,",
                  "                        modifier = Modifier.basicMarquee(),",
                  "                        style = MaterialTheme.typography.bodySmall,",
                  "                        maxLines = 1,",
                  "                        overflow = TextOverflow.Clip,",
                  "                        softWrap = false,",
                  "                    )",
              ]
          )
          text = text[:start] + replacement + text[end:]
          components.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            kanarek/app/src/main/java/com/kanarek/player/PlayerService.kt \
            kanarek/app/src/main/java/com/kanarek/ui/PlayerComponents.kt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "kanarek: format live player metadata [skip ci]"
          git push origin HEAD:${{ github.head_ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.6.0
          fi

      - name: Build, test & lint
        run: ./gradlew assemblePlayDebug assembleFossDebug testPlayDebugUnitTest lintPlayDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: kanarek-debug-apk
          path: kanarek/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: warn
