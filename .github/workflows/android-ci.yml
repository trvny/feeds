name: Android CI

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths: ["kanarek/**", "!kanarek/worker/**"]
  pull_request:
    branches: [main]
    paths: ["kanarek/**", "!kanarek/worker/**"]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: kanarek
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          ref: ${{ github.head_ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.6.0
          fi

      - name: Assemble play
        id: assemble
        continue-on-error: true
        run: ./gradlew assemblePlayDebug --stacktrace 2>&1 | tee assemble-play.log

      - name: Save compile diagnostic
        if: steps.assemble.outcome == 'failure'
        working-directory: .
        run: |
          grep -E '(^e: |error:|Unresolved reference|Compilation error|FAILURE:)' kanarek/assemble-play.log > .ci-player-wake-error.txt || tail -n 100 kanarek/assemble-play.log > .ci-player-wake-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-player-wake-error.txt
          git commit -m "ci: capture player wake compile error [skip ci]"
          git push origin HEAD:${{ github.head_ref }}

      - name: Apply compile gate
        if: steps.assemble.outcome == 'failure'
        run: exit 1
