name: Android CI

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths: ["kanarek/**", "!kanarek/worker/**"]
  pull_request:
    branches: [main]
    paths: ["kanarek/**", "!kanarek/worker/**"]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: kanarek
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          ref: ${{ github.head_ref }}

      - name: Connect live player metadata
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path("kanarek/app/src/main/java/com/kanarek/player/PlayerService.kt")
          text = service.read_text()
          old = '''                override fun onMetadata(metadata: androidx.media3.common.Metadata) {
                      if (_uiState.value.failure != null) return
                      for (i in 0 until metadata.length()) {
                          val entry = metadata.get(i)
                          if (entry is androidx.media3.extractor.metadata.icy.IcyInfo) {
                              val title = entry.title?.trim()?.takeIf { it.isNotEmpty() }
                              if (_uiState.value.nowPlaying != title) {
                                  _uiState.value = _uiState.value.copy(nowPlaying = title)
                                  pushWidget()
                              }
                              return
                          }
                      }
                  }
          '''
          new = '''                override fun onMetadata(metadata: androidx.media3.common.Metadata) {
                      if (_uiState.value.failure != null) return
                      for (i in 0 until metadata.length()) {
                          val entry = metadata.get(i)
                          if (entry is androidx.media3.extractor.metadata.icy.IcyInfo) {
                              updateNowPlaying(entry.title)
                              return
                          }
                      }
                  }

                  override fun onMediaMetadataChanged(mediaMetadata: MediaMetadata) {
                      if (_uiState.value.failure != null) return
                      updateNowPlaying(
                          streamMetadataText(
                              station = _uiState.value.currentStation,
                              title = mediaMetadata.title,
                              artist = mediaMetadata.artist,
                          ),
                      )
                  }
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif "override fun onMediaMetadataChanged" not in text:
              raise SystemExit("PlayerService metadata block not found")

          old = '''    private fun pushState() {
                  _uiState.value =
                      _uiState.value.copy(
                          currentIndex = activePlayer.currentMediaItemIndex,
                          isPlaying = activePlayer.isPlaying,
                          isBuffering = activePlayer.playbackState == Player.STATE_BUFFERING,
                      )
                  pushWidget()
              }

              private fun pushWidget() {
          '''
          new = '''    private fun pushState() {
                  _uiState.value =
                      _uiState.value.copy(
                          currentIndex = activePlayer.currentMediaItemIndex,
                          isPlaying = activePlayer.isPlaying,
                          isBuffering = activePlayer.playbackState == Player.STATE_BUFFERING,
                      )
                  pushWidget()
              }

              private fun updateNowPlaying(value: CharSequence?) {
                  val normalized = value?.toString()?.trim()?.takeIf(String::isNotEmpty)
                  if (_uiState.value.nowPlaying == normalized) return
                  _uiState.value = _uiState.value.copy(nowPlaying = normalized)
                  pushWidget()
              }

              private fun pushWidget() {
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif "private fun updateNowPlaying" not in text:
              raise SystemExit("PlayerService pushState block not found")

          old = '''            errorText = state.failure?.let(::failureText),
                  )
          '''
          new = '''            errorText = state.failure?.let(::failureText),
                      nowPlaying = state.nowPlaying,
                  )
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif "nowPlaying = state.nowPlaying" not in text:
              raise SystemExit("PlayerService widget call not found")
          service.write_text(text)

          components = Path("kanarek/app/src/main/java/com/kanarek/ui/PlayerComponents.kt")
          text = components.read_text()
          old = "import androidx.compose.foundation.background\n"
          if "import androidx.compose.foundation.basicMarquee\n" not in text:
              if old not in text:
                  raise SystemExit("PlayerComponents import anchor not found")
              text = text.replace(old, old + "import androidx.compose.foundation.basicMarquee\n", 1)

          old = '''@Composable
          internal fun PlayerBottomControls(
          '''
          new = '''@OptIn(ExperimentalFoundationApi::class)
          @Composable
          internal fun PlayerBottomControls(
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif "@OptIn(ExperimentalFoundationApi::class)\n@Composable\ninternal fun PlayerBottomControls" not in text:
              raise SystemExit("PlayerBottomControls anchor not found")

          old = '''                    Text(
                              subtitle,
                              style = MaterialTheme.typography.bodySmall,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis,
                          )
          '''
          new = '''                    Text(
                              subtitle,
                              modifier = Modifier.basicMarquee(),
                              style = MaterialTheme.typography.bodySmall,
                              maxLines = 1,
                              overflow = TextOverflow.Clip,
                              softWrap = false,
                          )
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif "modifier = Modifier.basicMarquee()" not in text:
              raise SystemExit("Player metadata Text block not found")
          components.write_text(text)
          PY

          if git diff --quiet -- \
            kanarek/app/src/main/java/com/kanarek/player/PlayerService.kt \
            kanarek/app/src/main/java/com/kanarek/ui/PlayerComponents.kt; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            kanarek/app/src/main/java/com/kanarek/player/PlayerService.kt \
            kanarek/app/src/main/java/com/kanarek/ui/PlayerComponents.kt
          git commit -m "kanarek: connect live player metadata [skip ci]"
          git push origin HEAD:${{ github.head_ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.6.0
          fi

      - name: Build, test & lint
        # Flavor-qualified tasks: with product flavors (play/foss) AGP no longer creates
        # plain testDebugUnitTest/lintDebug. Unit tests and lint run on play (superset of
        # sources); fossDebug is assembled too so a GMS reference leaking into main/foss
        # sources fails CI immediately.
        run: ./gradlew assemblePlayDebug assembleFossDebug testPlayDebugUnitTest lintPlayDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: kanarek-debug-apk
          path: kanarek/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: warn
