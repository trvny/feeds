name: Worker CI

on:
  push:
    branches: [main]
    paths:
      - "feeds-proxy/**"
      - "!feeds-proxy/**/*.md"
      - ".github/workflows/worker-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "feeds-proxy/**"
      - "!feeds-proxy/**/*.md"
      - ".github/workflows/worker-ci.yml"
  workflow_dispatch:

concurrency:
  group: worker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check feeds-proxy
    runs-on: ubuntu-slim
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: feeds-proxy/package-lock.json

      - name: Check feeds-proxy
        working-directory: feeds-proxy
        run: |
          npm ci
          npm run typecheck
