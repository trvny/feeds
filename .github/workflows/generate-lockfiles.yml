name: Generate runtime lockfiles

on:
  push:
    branches:
      - deps/lock-runtime-dependencies
    paths:
      - ".github/workflows/generate-lockfiles.yml"
      - ".gitignore"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-python: true

      - name: Generate Feedseek lockfile
        working-directory: feedseek
        run: uv lock

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate feeds-proxy lockfile
        working-directory: feeds-proxy
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feedseek/uv.lock feeds-proxy/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build: lock runtime dependencies"
          git push
