---
name: Repair PR 136

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - feeds/github-europa-audio
    paths:
      - .github/workflows/pr136-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: feeds/github-europa-audio
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-python: true

      - name: Revert unrelated proxy changes
        run: |
          git fetch origin main
          git checkout origin/main -- feeds-proxy/README.md feeds-proxy/src/index.js

      - name: Apply review fixes
        run: python .github/scripts/pr136_repair.py

      - name: Install Feedseek dependencies
        working-directory: feedseek
        run: uv sync

      - name: Format changed Python
        working-directory: feedseek
        run: |
          files=(
            feed_generators/audio.py
            feed_generators/docs_sources.py
            feed_generators/github.py
            feed_generators/microsoft.py
            feed_generators/mozilla.py
            feed_generators/multi_rss.py
            feed_generators/tvp.py
            feed_generators/usgov.py
          )
          uv run ruff check --fix-only "${files[@]}"
          uvx isort "${files[@]}"
          uvx black --line-length 120 "${files[@]}"
          uv run ruff check --fix-only "${files[@]}"

      - name: Regenerate source documentation
        working-directory: feedseek
        run: uv run python feed_generators/docs_sources.py

      - name: Generate new feeds and artifacts
        working-directory: feedseek
        run: |
          uv run python feed_generators/audio.py
          uv run python feed_generators/github.py
          uv run python feed_generators/europa.py

      - name: Validate Feedseek
        working-directory: feedseek
        run: |
          uv run python -m unittest discover -s tests
          uv run feed_generators/validate_feeds.py
          git diff --check

      - name: Verify scope
        run: |
          if ! git diff --quiet origin/main -- feeds-proxy/; then
            echo "feeds-proxy still differs from main"
            git diff --stat origin/main -- feeds-proxy/
            exit 1
          fi
          test -f feedseek/feeds/feed_audio.json
          test -f feedseek/feeds/feed_europa.json
          test -f feedseek/feeds/feed_github.json
          test -f feedseek/cache/audio_posts.json
          test -f feedseek/cache/europa_posts.json
          test -f feedseek/cache/github_posts.json

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(feedseek): address PR review"
          git push origin HEAD:feeds/github-europa-audio
