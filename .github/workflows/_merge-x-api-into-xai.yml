name: Merge X API changelog into xAI

on:
  push:
    branches: [merge-x-api-into-xai]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6

      - name: Integrate source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("feed_generators/xai.py")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              "    - xAI API release notes  https://docs.x.ai/developers/release-notes (Mintlify .md)\n",
              "    - xAI API release notes  https://docs.x.ai/developers/release-notes (Mintlify .md)\n"
              "    - X API changelog         https://docs.x.com/changelog                (HTML)\n",
          )
          text = text.replace(
              "from enrich import enrich_entries\n",
              "from enrich import enrich_entries\n"
              "from x_changelog import (\n"
              "    BLOG_URL as X_API_CHANGELOG_URL,\n"
              "    fetch_text as fetch_x_api_changelog,\n"
              "    parse_items as parse_x_api_items,\n"
              ")\n",
          )

          marker = "# --------------------------------------------------------------------------- #\n# Orchestration\n# --------------------------------------------------------------------------- #\n"
          adapter = (
              "# --------------------------------------------------------------------------- #\n"
              "# X (Twitter) API changelog\n"
              "# --------------------------------------------------------------------------- #\n\n\n"
              "def scrape_x_api_changelog(known_links):\n"
              "    label = \"X API changelog\"\n"
              "    html = fetch_x_api_changelog(X_API_CHANGELOG_URL)\n"
              "    if html is None:\n"
              "        logger.warning(f\"  [{label}] fetch failed\")\n"
              "        return []\n\n"
              "    entries = []\n"
              "    for item in parse_x_api_items(html):\n"
              "        if item[\"link\"] in known_links:\n"
              "            continue\n"
              "        item[\"source\"] = label\n"
              "        entries.append(item)\n"
              "        logger.info(f\"  [{label}] {item['title']}\")\n"
              "    return entries\n\n\n"
          )
          if "def scrape_x_api_changelog(" not in text:
              text = text.replace(marker, adapter + marker)

          text = text.replace(
              "    logger.info(\"Scraping xAI API release notes ...\")\n"
              "    new_entries += scrape_release_notes(known_links)\n"
              "    return new_entries\n",
              "    logger.info(\"Scraping xAI API release notes ...\")\n"
              "    new_entries += scrape_release_notes(known_links)\n"
              "    logger.info(\"Scraping X API changelog ...\")\n"
              "    new_entries += scrape_x_api_changelog(known_links)\n"
              "    return new_entries\n",
          )
          text = text.replace(
              '        "release notes."\n',
              '        "release notes, plus the X developer API changelog."\n',
          )
          path.write_text(text, encoding="utf-8")

          feeds = Path("feeds.yaml")
          cfg = feeds.read_text(encoding="utf-8")
          cfg = re.sub(
              r"(?m)^  x_changelog:\n    script: x_changelog\.py\n    type: requests\n    blog_url: https://docs\.x\.com/changelog\n",
              "",
              cfg,
          )
          feeds.write_text(cfg, encoding="utf-8")

          makefile = Path("Makefile")
          mk = makefile.read_text(encoding="utf-8")
          mk = re.sub(
              r"(?ms)^\.PHONY: feeds_x_changelog(?:_full)?\nfeeds_x_changelog(?:_full)?:.*?(?=^\.PHONY:|\Z)",
              "",
              mk,
          )
          makefile.write_text(mk, encoding="utf-8")

          selection = Path("site/published_feeds.txt")
          if selection.exists():
              lines = selection.read_text(encoding="utf-8").splitlines()
              selection.write_text(
                  "\n".join(line for line in lines if "x_changelog" not in line) + "\n",
                  encoding="utf-8",
              )

          readme = Path("README.md")
          if readme.exists():
              lines = readme.read_text(encoding="utf-8").splitlines()
              readme.write_text(
                  "\n".join(
                      line for line in lines
                      if "feed_x_changelog" not in line and "`x_changelog`" not in line
                  ) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Test grouped feed
        shell: bash
        run: |
          uv run --locked ruff check --fix --select I001 feed_generators/xai.py
          uv run --locked ruff check --select I001 feed_generators/xai.py
          uv run --locked python feed_generators/run_all_feeds.py --feed xai
          grep -q 'https://docs.x.com/changelog' feeds/feed_xai.xml
          grep -q 'https://docs.x.com/changelog' feeds/feed_xai.json

      - name: Remove standalone feed and refresh indexes
        shell: bash
        run: |
          rm -f feeds/feed_x_changelog.xml feeds/feed_x_changelog.json cache/x_changelog_posts.json
          uv run --locked python feed_generators/docs_sources.py
          uv run --locked python site/make_opml.py
          uv run --locked python feed_generators/validate_feeds.py
          test ! -e feeds/feed_x_changelog.xml
          test ! -e feeds/feed_x_changelog.json
          grep -q 'https://docs.x.com/changelog' feeds/feed_xai.xml

      - name: Commit result
        shell: bash
        run: |
          rm .github/workflows/_merge-x-api-into-xai.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: merge X API changelog into xAI"
          git push
