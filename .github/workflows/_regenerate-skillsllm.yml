name: Regenerate SkillsLLM artifacts

on:
  push:
    branches: [add-cognition-devin-sources]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Regenerate SkillsLLM
        run: uv run --locked python feed_generators/run_all_feeds.py --feed skillsllm
      - name: Verify requested sources are published
        shell: bash
        run: |
          grep -Eq 'https://cognition.com/|https://docs.devin.ai/' feeds/feed_skillsllm.xml
          grep -Eq 'https://cognition.com/|https://docs.devin.ai/' feeds/feed_skillsllm.json
          grep -Eq 'https://cognition.com/|https://docs.devin.ai/' cache/skillsllm_posts.json
      - name: Commit generated artifacts
        shell: bash
        run: |
          rm .github/workflows/_regenerate-skillsllm.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/feed_skillsllm.xml feeds/feed_skillsllm.json cache/skillsllm_posts.json .github/workflows/_regenerate-skillsllm.yml
          git commit -m "chore: regenerate SkillsLLM feed"
          git push
