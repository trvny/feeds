name: Release
on: # yamllint disable-line rule:truthy
  push:
    tags: ["kanarek-v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or ref to publish
        required: true
        default: main
        type: string
      reset_legacy:
        description: Delete the old kanarek-v1.0.0..1.0.2 tags/releases before the new 1.0.0 baseline
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kanarek
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          persist-credentials: false

      - name: Resolve release version
        id: release
        run: |
          declared_version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          if ! printf '%s\n' "$declared_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::kanarek/app/build.gradle.kts must declare a semantic version such as 1.0.0."
            exit 1
          fi

          release_tag="kanarek-v${declared_version}"
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && [ "$GITHUB_REF_NAME" != "$release_tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version $declared_version (expected $release_tag)."
            exit 1
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=$declared_version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Reset legacy Kanarek release tags
        if: github.event_name == 'workflow_dispatch' && inputs.reset_legacy
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ "$RELEASE_VERSION" != "1.0.0" ]; then
            echo "::error::Legacy reset is only allowed for the 1.0.0 baseline."
            exit 1
          fi

          for tag in kanarek-v1.0.0 kanarek-v1.0.1 kanarek-v1.0.2; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
            fi
          done

      - name: Guard release tag target
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          TARGET_SHA: ${{ steps.release.outputs.sha }}
        run: |
          remote_sha="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          if [ -n "$remote_sha" ] && [ "$remote_sha" != "$TARGET_SHA" ]; then
            echo "::error::Tag $RELEASE_TAG already points at $remote_sha instead of $TARGET_SHA."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"
          cache-disabled: true # release build must not trust a poisonable cache

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.6.1

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set — cannot produce a signed release APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK to kanarek-<version>
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mv app/build/outputs/apk/play/release/app-play-release.apk \
             "app/build/outputs/apk/play/release/kanarek-${RELEASE_VERSION}.apk"
          mv app/build/outputs/apk/foss/release/app-foss-release.apk \
             "app/build/outputs/apk/foss/release/kanarek-${RELEASE_VERSION}-foss.apk"

      - name: Publish release with APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ steps.release.outputs.sha }}
          name: Kanarek ${{ steps.release.outputs.version }}
          files: kanarek/app/build/outputs/apk/*/release/kanarek-*.apk
          generate_release_notes: true
