name: Release
on: # yamllint disable-line rule:truthy
  push:
    tags: ["kanarek-v*"]
  workflow_dispatch:
    inputs:
      reset_legacy:
        description: Replace the old experimental 1.0.0 state and clean up 1.0.1-1.0.2
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-kanarek
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kanarek
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release version
        id: release
        run: |
          declared_version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          if ! printf '%s\n' "$declared_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::kanarek/app/build.gradle.kts must declare a semantic version such as 1.0.0."
            exit 1
          fi

          release_tag="kanarek-v${declared_version}"
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && [ "$GITHUB_REF_NAME" != "$release_tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version $declared_version (expected $release_tag)."
            exit 1
          fi

          previous_tag="$(git describe --tags --abbrev=0 --match 'kanarek-v*' HEAD^ 2>/dev/null || true)"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=$declared_version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Validate release target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          TARGET_SHA: ${{ steps.release.outputs.sha }}
          RESET_LEGACY: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_legacy || false }}
        run: |
          if [ "$RESET_LEGACY" = "true" ]; then
            if [ "$RELEASE_VERSION" != "1.0.0" ]; then
              echo "::error::Legacy reset is only allowed for the 1.0.0 baseline."
              exit 1
            fi
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::The 1.0.0 baseline release already exists; reset_legacy is one-time only."
              exit 1
            fi
            exit 0
          fi

          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tagged_sha="$(git rev-parse "$RELEASE_TAG^{commit}")"
            if [ "$tagged_sha" != "$TARGET_SHA" ]; then
              echo "::error::Tag $RELEASE_TAG points at $tagged_sha instead of $TARGET_SHA."
              exit 1
            fi
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && \
             [ "$GITHUB_RUN_ATTEMPT" -eq 1 ]; then
            echo "::error::Release $RELEASE_TAG already exists. Bump versionName and versionCode before publishing another release."
            exit 1
          fi

      - name: Build Kanarek release notes
        env:
          PREVIOUS_TAG: ${{ steps.release.outputs.previous_tag }}
          RESET_LEGACY: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_legacy || false }}
        run: |
          {
            echo "## What's Changed"
            if [ "$RESET_LEGACY" = "true" ]; then
              echo "* Kanarek 1.0.0 baseline release."
            elif [ -n "$PREVIOUS_TAG" ]; then
              notes="$(git -C "$GITHUB_WORKSPACE" log "$PREVIOUS_TAG..HEAD" --pretty=format:'* %s' -- kanarek)"
              if [ -n "$notes" ]; then
                printf '%s\n' "$notes"
              else
                echo "* Kanarek release maintenance."
              fi
            else
              echo "* Kanarek 1.0.0 baseline release."
            fi
          } > release-notes.md

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"
          cache-disabled: true # release build must not trust a poisonable cache

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.6.1

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set - cannot produce a signed release APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK to kanarek-<version>
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mv app/build/outputs/apk/play/release/app-play-release.apk \
             "app/build/outputs/apk/play/release/kanarek-${RELEASE_VERSION}.apk"
          mv app/build/outputs/apk/foss/release/app-foss-release.apk \
             "app/build/outputs/apk/foss/release/kanarek-${RELEASE_VERSION}-foss.apk"

      - name: Remove legacy 1.0.0 before replacement
        if: github.event_name == 'workflow_dispatch' && inputs.reset_legacy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=kanarek-v1.0.0
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          fi
          if gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
          fi

      - name: Publish release with APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ steps.release.outputs.sha }}
          name: Kanarek ${{ steps.release.outputs.version }}
          body_path: kanarek/release-notes.md
          files: kanarek/app/build/outputs/apk/*/release/kanarek-*.apk

      - name: Clean remaining legacy releases and tags
        if: github.event_name == 'workflow_dispatch' && inputs.reset_legacy && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in kanarek-v1.0.1 kanarek-v1.0.2; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              if ! gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes; then
                echo "::warning::Could not delete legacy release $tag."
              fi
            fi
            if gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              if ! gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"; then
                echo "::warning::Could not delete legacy tag $tag."
              fi
            fi
          done
