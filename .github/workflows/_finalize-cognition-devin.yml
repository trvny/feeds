name: Finalize Cognition and Devin sources

on:
  push:
    branches: [add-cognition-devin-sources]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Apply formatting fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("feed_generators/skillsllm.py")
          text = path.read_text(encoding="utf-8")
          old = "]\n\ndef doc_sources():"
          new = "]\n\n\ndef doc_sources():"
          if old not in text:
              raise SystemExit("doc_sources spacing anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Test parsers
        shell: bash
        run: |
          uv run --locked ruff check feed_generators/cognition.py tests/test_cognition_sources.py
          uv run --locked python -m unittest tests/test_cognition_sources.py
      - name: Regenerate SkillsLLM artifacts
        shell: bash
        run: |
          uv run --locked python feed_generators/run_all_feeds.py --feed skillsllm
          uv run --locked python feed_generators/docs_sources.py
          grep -Eq 'https://cognition.com/|https://docs.devin.ai/' feeds/feed_skillsllm.xml
          grep -Eq 'https://cognition.com/|https://docs.devin.ai/' feeds/feed_skillsllm.json
          grep -Eq 'https://cognition.com/|https://docs.devin.ai/' cache/skillsllm_posts.json
      - name: Commit result
        shell: bash
        run: |
          rm .github/workflows/_finalize-cognition-devin.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed_generators/skillsllm.py feeds/feed_skillsllm.xml feeds/feed_skillsllm.json cache/skillsllm_posts.json docs/sources.md .github/workflows/_finalize-cognition-devin.yml
          git commit -m "chore: refresh SkillsLLM artifacts"
          git push
