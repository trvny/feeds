name: PR 338 Claude Cache Migration

on:
  push:
    branches:
      - gptomek/add-requested-feeds
    paths:
      - ".github/workflows/pr338-claude-migrate.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked

      - name: Make legacy Platform rows refreshable
        run: |
          uv run --no-project python - <<'PY'
          from pathlib import Path

          path = Path("feed_generators/claude.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "MAX_ENTRIES = 150\n",
              'MAX_ENTRIES = 150\nLEGACY_PLATFORM_RELEASE_SOURCE = "Claude Platform release notes"\n',
              1,
          )
          helpers = '''def _known_links_for_refresh(cached):
              """Keep legacy Platform links eligible for native RSS refresh."""
              return {
                  entry["link"]
                  for entry in cached
                  if entry.get("source") != LEGACY_PLATFORM_RELEASE_SOURCE
              }


          def _cache_for_merge(cached, new_articles):
              """Drop legacy Platform rows only after native RSS returned replacements."""
              if not any(
                  entry.get("source") == "Claude Platform" for entry in new_articles
              ):
                  return cached
              return [
                  entry
                  for entry in cached
                  if entry.get("source") != LEGACY_PLATFORM_RELEASE_SOURCE
              ]


          '''
          text = text.replace("def main(full=False):\n", helpers + "def main(full=False):\n", 1)
          text = text.replace(
              '    known_links = {e["link"] for e in cached}\n',
              "    known_links = _known_links_for_refresh(cached)\n",
              1,
          )
          text = text.replace(
              '    merged = merge_entries(new_articles, cached, id_field="link", date_field="date")\n',
              '    merge_cache = _cache_for_merge(cached, new_articles)\n'
              '    merged = merge_entries(\n'
              '        new_articles, merge_cache, id_field="link", date_field="date"\n'
              '    )\n',
              1,
          )
          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_requested_feed_sources.py")
          tests = test_path.read_text(encoding="utf-8")
          anchor = '''    def test_microsoft_includes_requested_sources(self):
          '''
          test = '''    def test_claude_migrates_legacy_platform_rows_after_rss_success(self):
                  legacy_link = (
                      "https://platform.claude.com/docs/en/release-notes/"
                      "overview#example"
                  )
                  legacy = {
                      "link": legacy_link,
                      "source": claude.LEGACY_PLATFORM_RELEASE_SOURCE,
                  }
                  other = {
                      "link": "https://claude.com/blog/example",
                      "source": "Claude Blog",
                  }
                  native = {"link": legacy_link, "source": "Claude Platform"}

                  known = claude._known_links_for_refresh([legacy, other])
                  self.assertNotIn(legacy_link, known)
                  self.assertIn(other["link"], known)
                  self.assertEqual(
                      claude._cache_for_merge([legacy, other], []),
                      [legacy, other],
                  )
                  self.assertEqual(
                      claude._cache_for_merge([legacy, other], [native]),
                      [other],
                  )

          '''
          if anchor not in tests:
              raise SystemExit("test insertion anchor not found")
          test_path.write_text(tests.replace(anchor, test + anchor, 1), encoding="utf-8")
          PY

      - name: Run focused tests
        run: |
          uv run --locked python -m unittest \
            tests.test_requested_feed_sources \
            tests.test_cognition_sources

      - name: Regenerate Claude feed
        run: uv run --locked python feed_generators/claude.py

      - name: Verify native Platform cache migration
        run: |
          uv run --no-project python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("cache/claude_posts.json").read_text(encoding="utf-8"))
          sources = {entry.get("source") for entry in data.get("entries", [])}
          if "Claude Platform release notes" in sources:
              raise SystemExit("legacy Claude Platform cache rows remain")
          if "Claude Platform" not in sources:
              raise SystemExit("native Claude Platform rows missing")
          PY
          uv run --locked python feed_generators/validate_feeds.py

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            feed_generators/claude.py \
            tests/test_requested_feed_sources.py \
            cache/claude_posts.json \
            feeds/feed_claude.xml \
            feeds/feed_claude.json
          git diff --staged --check
          git commit -m 'Migrate Claude Platform cache to native RSS'
          git push origin HEAD:gptomek/add-requested-feeds
