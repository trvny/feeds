name: Fix registry count after X API merge

on:
  push:
    branches: [merge-x-api-into-xai-verify]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Fix count and test
        shell: bash
        run: |
          sed -i 's/feeds-92-d6541a/feeds-91-d6541a/g' README.md README_pl.md
          sed -i 's/feeds.yaml (92 źródeł)/feeds.yaml (91 źródeł)/g' README_pl.md
          uv run --locked python -m unittest tests/test_registry_docs.py
      - name: Commit result
        shell: bash
        run: |
          rm .github/workflows/_fix-xai-feed-count.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README_pl.md .github/workflows/_fix-xai-feed-count.yml
          git commit -m "docs: update feed count after X API merge"
          git push
