name: Probe Red Hat sources
on:
  push:
    branches: [add-redhat-enterprise]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -q requests beautifulsoup4 lxml curl_cffi
      - name: Inspect HTML layouts
        run: |
          python - <<'PY'
          import re
          from bs4 import BeautifulSoup
          from curl_cffi import requests

          def fetch(url):
              return requests.get(url, impersonate='chrome', timeout=30).text

          newsroom = BeautifulSoup(fetch('https://www.redhat.com/en/about/newsroom'), 'html.parser')
          links = newsroom.select('a[href*="/en/about/press-releases/"]')
          print('NEWSROOM LINKS', len(links))
          seen = set()
          for link in links:
              href = link.get('href','')
              if not href or href in seen:
                  continue
              seen.add(href)
              print('\nNEWS', href, 'TITLE=', repr(link.get_text(' ', strip=True)[:180]))
              node = link
              for depth in range(1, 6):
                  node = node.parent
                  if node is None:
                      break
                  text = re.sub(r'\s+', ' ', node.get_text(' ', strip=True))
                  dates = re.findall(r'(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\s+\d{1,2},\s+\d{4}', text, re.I)
                  print(' depth', depth, 'tag', node.name, 'class', node.get('class'), 'dates', dates[:2], 'text', repr(text[:300]))
              if len(seen) >= 4:
                  break

          changelog = BeautifulSoup(fetch('https://access.redhat.com/articles/5554431'), 'html.parser')
          print('\nCHANGELOG HEADINGS')
          for heading in changelog.find_all(['h1','h2','h3'])[:45]:
              print(heading.name, 'id=', heading.get('id'), 'class=', heading.get('class'), repr(heading.get_text(' ', strip=True)[:180]))
          PY
